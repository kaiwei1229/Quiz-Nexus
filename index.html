<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Nexus</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    font-family: 'Orbitron', 'Microsoft JhengHei', sans-serif;
    background: #05030d;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
}

.sao-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #0a061a, #05030d 60%, #02010a 100%);
    z-index: 100;
}

/* 中心爆發粒子 */
.particle-burst {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    pointer-events: none;
}

/* 掃描圓環 */
.scan-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 3px solid transparent;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
}

/* 故障效果 */
@keyframes glitch {
    0%, 100% { 
        transform: translate(0, 0);
        filter: hue-rotate(0deg);
    }
    20% { transform: translate(-2px, 2px); filter: hue-rotate(90deg); }
    40% { transform: translate(2px, -2px); filter: hue-rotate(180deg); }
    60% { transform: translate(-2px, -2px); filter: hue-rotate(270deg); }
    80% { transform: translate(2px, 2px); filter: hue-rotate(360deg); }
}

/* 中心標誌 */
.center-logo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 101;
    opacity: 0;
    animation: logo-appear 1.2s ease-out forwards;
}

.logo-warp {
    animation: logo-warp 1.5s ease-in forwards;
}

@keyframes logo-warp {
    0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }
    100% {
        transform: translate(-50%, -50%) scale(6);
        opacity: 0;
        filter: blur(5px);
    }
}

@keyframes logo-appear {
    0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
    }
    60% {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 1;
    }
    100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }
}

.logo-ring {
    width: 350px;
    height: 350px;
    border: 4px solid transparent;
    border-top-color: #ff00ff;
    border-right-color: #00ffff;
    border-bottom-color: #ff00ff;
    border-left-color: #8b2bdc;
    border-radius: 50%;
    position: relative;
    animation: logo-rotate 2s linear infinite;
    box-shadow: 
        0 0 40px rgba(255, 0, 255, 0.8),
        0 0 80px rgba(0, 255, 255, 0.6),
        inset 0 0 40px rgba(138, 43, 220, 0.4);
}

@keyframes logo-rotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.logo-ring::before,
.logo-ring::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    border: 2px solid transparent;
}

.logo-ring::before {
    top: -20px;
    left: -20px;
    right: -20px;
    bottom: -20px;
    border-top-color: rgba(0, 255, 255, 0.4);
    border-bottom-color: rgba(255, 0, 255, 0.4);
    animation: logo-rotate-reverse 2.5s linear infinite;
}

.logo-ring::after {
    top: 10px;
    left: 10px;
    right: 10px;
    bottom: 10px;
    border-left-color: rgba(255, 0, 255, 0.6);
    border-right-color: rgba(0, 255, 255, 0.6);
    animation: logo-rotate 2s linear infinite;
}

@keyframes logo-rotate-reverse {
    0% { transform: rotate(360deg); }
    100% { transform: rotate(0deg); }
}


.logo-inner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 220px;
    height: 220px;
    border: 3px solid rgba(138, 43, 220, 0.6);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(26, 0, 51, 0.95), rgba(0, 0, 0, 0.98));
    box-shadow: inset 0 0 40px rgba(138, 43, 220, 0.5);
    pointer-events: none;
}

.logo-text {
    position: absolute;
    top: 48%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
}

/* 標題文字 - 不旋轉 */
.title-text {
    font-size: 2.5em;
    font-weight: 900;
    letter-spacing: 10px;
    background: linear-gradient(45deg, #ff00ff, #00ffff, #ff00ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: title-glow 3s linear infinite;
    filter: drop-shadow(0 0 14px #ff00ff);
    text-align: center;
    margin: 0;
    position: relative;
    z-index: 10;
}

@keyframes title-glow {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
}

.subtitle-text {
    font-size: 1em;
    color: #00ffff;
    text-shadow: 0 0 8px #00ffff;
    letter-spacing: 6px;
    font-weight: 300;
    margin-top: 12px;
    text-align: center;
    position: relative;
    z-index: 10;
}

/* 漂浮粒子 */
.floating-particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    pointer-events: none;
    animation: float-pulse var(--dur, 5s) ease-in-out var(--delay, 0s) infinite;
}

@keyframes float-pulse {
    0%, 100% {
        transform: translate(0, 0) scale(1);
        opacity: 0.5;
    }
    50% {
        transform: translate(var(--dx, 0px), var(--dy, 0px)) scale(1.6);
        opacity: 1;
    }
}

/* 穿越粒子線條 */
.warp-particle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    pointer-events: none;
    animation: warp-line var(--dur, 1.8s) ease-in var(--delay, 0s) forwards;
    transform-origin: center;
    z-index: 50; /* 默认在圆圈后面 */
}

.warp-particle.center {
    z-index: 10; /* 中心粒子在圆圈更后面，被遮挡 */
}

@keyframes warp-line {
    0% {
        transform: translate(0, 0) rotate(var(--angle, 0rad)) scaleX(0.6);
        width: 4px;
        height: 4px;
        opacity: 0;
        box-shadow: 0 0 4px var(--color, #ff00ff);
    }
    12% { opacity: 1; }
    35% {
        width: 150px;
        height: 3px;
        border-radius: 50% / 30%;
        box-shadow: 0 0 20px var(--color, #ff00ff);
    }
    70% {
        width: 450px;
        height: 2px;
        border-radius: 50% / 20%;
        opacity: 0.9;
        box-shadow: 0 0 28px var(--color, #ff00ff);
    }
    100% {
        transform: translate(var(--tx, 0px), var(--ty, 0px)) rotate(var(--angle, 0rad)) scaleX(2);
        width: 700px;
        height: 1px;
        border-radius: 50% / 10%;
        opacity: 0;
        box-shadow: 0 0 36px var(--color, #ff00ff);
    }
}

/* 提示文字 */
.instruction {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    color: #00ffff;
    font-size: 1.3em;
    text-align: center;
    animation: pulse-instruction 2s ease-in-out infinite;
    text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
    z-index: 102;
    letter-spacing: 4px;
    font-weight: 300;
    pointer-events: none;
    transition: opacity 0.5s ease-out;
}

@keyframes pulse-instruction {
    0%, 100% { 
        opacity: 1; 
        transform: translateX(-50%) scale(1);
    }
    50% { 
        opacity: 0.6; 
        transform: translateX(-50%) scale(1.05);
    }
}

/* 進入動畫 - 快速縮放 */
.enter-animation {
    animation: warp-zoom 2s ease-in-out forwards;
}

@keyframes warp-zoom {
    0% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0px) brightness(1);
    }
    20% {
        opacity: 1;
        transform: scale(1.04);
        filter: blur(0px) brightness(1.05);
    }
    50% {
        opacity: 0.92;
        transform: scale(2.2);
        filter: blur(2px) brightness(1.25);
    }
    100% {
        opacity: 0;
        transform: scale(5.5);
        filter: blur(12px) brightness(1.5);
    }
}

/* 背景加速效果 */
.warp-speed {
    animation: bg-warp 2.5s ease-in forwards;
}

@keyframes bg-warp {
    0% {
        filter: brightness(1) saturate(1);
    }
    50% {
        filter: brightness(1.15) saturate(1.1);
    }
    100% {
        filter: brightness(1.3) saturate(1.2);
    }
}

/* 六角形網格背景 */
.hex-grid {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0.15;
    z-index: 1;
}

.hex {
    position: absolute;
    width: 80px;
    height: 46px;
    background: transparent;
    border: 1px solid #8b2bdc;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    animation: hex-pulse 4s ease-in-out infinite;
}

@keyframes hex-pulse {
    0%, 100% { opacity: 0.3; border-color: #8b2bdc; }
    50% { opacity: 0.8; border-color: #ff00ff; }
}

/* 隱藏類別 */
.hidden {
    display: none !important;
}

/* 手機版 RWD */
@media screen and (max-width: 768px) {
    .center-hexagon {
        width: 200px;
        height: 200px;
    }
}

@media screen and (max-width: 480px) {
    .center-hexagon {
        width: 180px;
        height: 180px;
    }
}

@media screen and (max-width: 360px) {
    .center-hexagon {
        width: 160px;
        height: 160px;
    }
}
</style>
</head>
<body>

<!-- 六角形網格背景 -->
<div class="hex-grid" id="hexGrid"></div>

<!-- SAO 風格容器 -->
<div class="sao-container" id="saoContainer">
    <!-- 中心 Logo -->
    <div class="center-logo" id="centerLogo">
        <div class="logo-ring"></div>
        <div class="logo-inner"></div>
        <div class="logo-text">
            <h1 class="title-text">Quiz Nexus</h1>
        </div>
    </div>
    
    <!-- 提示文字 -->
    <div class="instruction" id="instruction">
        ▶ CLICK TO ENTER ◀
    </div>
</div>

<!-- 粒子爆發容器 -->
<div id="particleContainer" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 200;"></div>

<script src="js/bgm.js"></script>
<script>
let isEntering = false;
const loginSound = new Audio('assets/login.mp3');
loginSound.preload = 'auto';
loginSound.volume = 0.7;
loginSound.loop = true;
const loginInitialVolume = 0.7;
loginSound.play().catch(err => console.log('無法自動播放 login 音樂:', err));

const openSound = new Audio('assets/open.mp3');
openSound.preload = 'auto';
openSound.volume = 0.8;
const openInitialVolume = 0.8;

// 針對行動裝置：若自動播放被阻擋，第一次互動時嘗試播放登入音效
function setupLoginAutoPlay() {
    const events = ['click', 'touchstart', 'keydown', 'pointerdown'];
    const tryPlay = () => {
        loginSound.play().catch(() => {});
    };
    events.forEach(evt => document.addEventListener(evt, tryPlay, { once: true }));
}

// 創建六角形網格
function createHexGrid() {
    const hexGrid = document.getElementById('hexGrid');
    const cols = Math.ceil(window.innerWidth / 80) + 1;
    const rows = Math.ceil(window.innerHeight / 46) + 1;
    
    for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
            const hex = document.createElement('div');
            hex.className = 'hex';
            hex.style.left = (col * 80 + (row % 2) * 40) + 'px';
            hex.style.top = (row * 46) + 'px';
            hex.style.animationDelay = (Math.random() * 4) + 's';
            hexGrid.appendChild(hex);
        }
    }
}

// 創建漂浮粒子裝飾
function createFloatingParticles() {
    const logo = document.getElementById('centerLogo');
    const colors = ['#ff00ff', '#4bd1ff', '#8b2bdc', '#ff66cc', '#35ffc8'];
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;
    const minDistance = 190; // 避免擋到圓圈（圓圈半徑 175px + 安全邊界）
    const maxDistance = Math.sqrt(centerX * centerX + centerY * centerY) * 1.3; // 超出螢幕邊界
    
    const particleCount = 100;
    
    for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'floating-particle';
        
        const color = colors[Math.floor(Math.random() * colors.length)];
        particle.style.background = color;
        particle.style.boxShadow = `0 0 10px ${color}`;
        
        // 使用加權分佈：越靠近中間越多
        // 用 Math.pow 調整曲線，讓中心密集
        const rand = Math.random();
        const distance = minDistance + Math.pow(rand, 1.8) * (maxDistance - minDistance);
        const angle = Math.random() * Math.PI * 2;
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;
        
        particle.style.left = `calc(50% + ${x}px)`;
        particle.style.top = `calc(50% + ${y}px)`;
        
        // 漂浮動畫設定
        const duration = 3 + Math.random() * 4;
        const delay = Math.random() * 2;
        const dx = (Math.random() - 0.5) * 90;
        const dy = (Math.random() - 0.5) * 90;
        particle.style.setProperty('--dur', `${duration}s`);
        particle.style.setProperty('--delay', `${delay}s`);
        particle.style.setProperty('--dx', `${dx}px`);
        particle.style.setProperty('--dy', `${dy}px`);
        
        logo.appendChild(particle);
    }
}

// 創建 SAO 風格穿越效果（粒子變線條）
function createWarpEffect() {
    const container = document.getElementById('particleContainer');
    const colors = ['#ff00ff', '#4bd1ff', '#8b2bdc', '#ff66cc', '#35ffc8', '#ff3366'];
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;
    
    // 創建更多穿越粒子，仍維持共享動畫以降低負擔
    for (let i = 0; i < 10; i++) {
        const particle = document.createElement('div');
        particle.className = 'warp-particle';
        
        // 隨機顏色
        const color = colors[Math.floor(Math.random() * colors.length)];
        
        // 隨機起始角度
        const angle = Math.random() * Math.PI * 2;
        const startDistance = 120 + Math.random() * 260;
        
        const startX = Math.cos(angle) * startDistance;
        const startY = Math.sin(angle) * startDistance;
        
        // 計算終點（穿越到屏幕外）
        const endDistance = Math.max(window.innerWidth, window.innerHeight) * 2;
        const endX = Math.cos(angle) * endDistance;
        const endY = Math.sin(angle) * endDistance;
        
        // 粒子初始位置
        particle.style.left = (centerX + startX) + 'px';
        particle.style.top = (centerY + startY) + 'px';
        particle.style.background = color;
        
        // 隨機延遲和持續時間（加長粒子穿越時間）
        const delay = Math.random() * 0.3;
        const duration = 1.8 + Math.random() * 1;
        
        // 設定 CSS 變數供共享動畫使用
        const angleRad = Math.atan2(endY - startY, endX - startX);
        particle.style.setProperty('--tx', `${endX - startX}px`);
        particle.style.setProperty('--ty', `${endY - startY}px`);
        particle.style.setProperty('--angle', `${angleRad}rad`);
        particle.style.setProperty('--color', color);
        particle.style.setProperty('--dur', `${duration}s`);
        particle.style.setProperty('--delay', `${delay}s`);
        
        container.appendChild(particle);
        
        // 清理
        setTimeout(() => {
            particle.remove();
        }, (duration + delay) * 1000 + 100);
    }
    
    // 圓圈中心爆發粒子（一開始就生成，被圓圈擋住，消失後才看得到）
    for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.className = 'warp-particle';
        
        const color = colors[Math.floor(Math.random() * colors.length)];
        
        // 從圓圈中心附近起始，向外擴散
        const angle = Math.random() * Math.PI * 2;
        const startDistance = 20 + Math.random() * 80; // 更接近中心
        
        const startX = Math.cos(angle) * startDistance;
        const startY = Math.sin(angle) * startDistance;
        
        // 計算終點（穿越到屏幕外）
        const endDistance = Math.max(window.innerWidth, window.innerHeight) * 2;
        const endX = Math.cos(angle) * endDistance;
        const endY = Math.sin(angle) * endDistance;
        
        particle.style.left = (centerX + startX) + 'px';
        particle.style.top = (centerY + startY) + 'px';
        particle.style.background = color;
        particle.classList.add('center'); // 标记为中心粒子，用于 z-index
        
        // 中心粒子：同时开始动画（和外圈粒子一样），只是被圆圈遮挡
        const delay = Math.random() * 1; // 和外圈粒子同时开始
        const duration = 1.8 + Math.random() * 2; // 和外圈粒子动画时间相同
        
        const angleRad = Math.atan2(endY - startY, endX - startX);
        particle.style.setProperty('--tx', `${endX - startX}px`);
        particle.style.setProperty('--ty', `${endY - startY}px`);
        particle.style.setProperty('--angle', `${angleRad}rad`);
        particle.style.setProperty('--color', color);
        particle.style.setProperty('--dur', `${duration}s`);
        particle.style.setProperty('--delay', `${delay}s`);
        
        container.appendChild(particle);
        
        setTimeout(() => {
            particle.remove();
        }, (duration + delay) * 1000 + 100);
    }
}

// 創建初始閃光效果
function createInitialFlash() {
    const container = document.getElementById('saoContainer');
    const flash = document.createElement('div');
    
    flash.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100px;
        height: 100px;
        background: radial-gradient(circle, rgba(255, 0, 255, 0.9), rgba(0, 0, 0, 0));
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
        z-index: 199;
    `;
    
    flash.style.animation = 'flash-expand 0.8s ease-out forwards';
    
    const keyframe = `
        @keyframes flash-expand {
            0% {
                width: 100px;
                height: 100px;
                opacity: 1;
            }
            50% {
                width: 600px;
                height: 600px;
                opacity: 0.8;
            }
            100% {
                width: 1200px;
                height: 1200px;
                opacity: 0;
            }
        }
    `;
    
    const style = document.createElement('style');
    style.textContent = keyframe;
    document.head.appendChild(style);
    
    container.appendChild(flash);
    
    setTimeout(() => {
        flash.remove();
        style.remove();
    }, 1000);
}

function enterWorld() {
    if (isEntering) return;
    isEntering = true;
    // 點擊時播放開場音效
    if (openSound) {
        openSound.currentTime = 0;
        openSound.play().catch(err => console.log('無法播放開場音效:', err));
    }
    
    const instruction = document.getElementById('instruction');
    const saoContainer = document.getElementById('saoContainer');
    const hexGrid = document.getElementById('hexGrid');
    const centerLogo = document.getElementById('centerLogo');
    
    // 隱藏提示文字（淡出）- 停止動畫並淡出
    instruction.style.animation = 'none';
    instruction.style.opacity = '0';
    
    // 初始閃光
    createInitialFlash();
    
    // 短暫延遲後開始穿越
    setTimeout(() => {
        // 創建穿越粒子線條效果
        createWarpEffect();
        
        // 背景加速效果
        saoContainer.classList.add('warp-speed');

        // 中心 Logo 放大後消失，模擬往前穿越
        centerLogo.classList.add('logo-warp');
        
        // 添加故障效果
        document.body.style.animation = 'glitch 0.18s ease-in-out 3';
        
        // Logo 和網格縮放消失
        setTimeout(() => {
            saoContainer.classList.add('enter-animation');
            hexGrid.style.opacity = '0';
            hexGrid.style.transition = 'opacity 0.5s ease-out';
            
            // 淡出所有音樂並跳轉到選單
            setTimeout(() => {
                loginSound.volume = loginInitialVolume;
                openSound.volume = openInitialVolume;
                
                // 添加頁面淡出效果
                document.body.style.transition = 'opacity 800ms ease-in';
                document.body.style.opacity = '0';
                
                const startTime = Date.now();
                const fadeDuration = 800; // 淡出 800ms
                const fadeInterval = setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / fadeDuration, 1);
                    loginSound.volume = loginInitialVolume * (1 - progress);
                    openSound.volume = openInitialVolume * (1 - progress);
                    if (progress >= 1) {
                        loginSound.pause();
                        openSound.pause();
                        clearInterval(fadeInterval);
                        window.location.href = 'menu.html';
                    }
                }, 20);
            }, 1500);
        }, 500);
    }, 150);
}

// 初始化
createHexGrid();
createFloatingParticles();

// 點擊進入
document.body.addEventListener('click', enterWorld);

// 初始化背景音樂
setupAutoPlay();
setupLoginAutoPlay();
</script>

</body>
</html>
